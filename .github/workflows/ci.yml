name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Test, check data, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Relinks the WebAssembly runtime without culture data (InvariantGlobalization in Ebt.App.csproj).
      - run: dotnet workload install wasm-tools
      - run: dotnet test
      - name: Content valid and wwwroot/data built from it
        run: dotnet run --project src/Ebt.Pipeline -- check
      - run: dotnet publish src/Ebt.App -c Release -o publish
      # The first visit downloads every published file (the service worker precaches them all), so growth is a
      # start-up cost on the phone. Measured on 2026-10-26: runtime and assemblies 5.42 MB, everything 7.04 MB
      # (uncompressed). Raise a budget only on purpose, with the reason in the commit.
      - name: Download size within budget
        working-directory: publish/wwwroot
        env:
          FRAMEWORK_BUDGET: 5900000
          TOTAL_BUDGET: 7700000
        run: |
          bytes() { find "$1" -type f -printf '%s\n' | awk '{ s += $1 } END { print s + 0 }'; }
          framework=$(bytes _framework)
          total=$(bytes .)
          echo "runtime and assemblies: $framework bytes (budget $FRAMEWORK_BUDGET)"
          echo "everything: $total bytes (budget $TOTAL_BUDGET)"
          [ "$framework" -le "$FRAMEWORK_BUDGET" ] && [ "$total" -le "$TOTAL_BUDGET" ]
      - id: pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v6
      - name: Serve from the GitHub Pages path
        if: github.event_name == 'push'
        working-directory: publish/wwwroot
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s|<base href=\"/\">|<base href=\"$BASE_PATH/\">|" index.html
          grep -q "<base href=\"$BASE_PATH/\">" index.html
          # Pages has no fallback to index.html: its 404 page starts the app on deep links like /exam.
          cp index.html 404.html
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: publish/wwwroot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
